<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="settings.title">浏览器扩展（斌斌） 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="settings.brand">浏览器扩展（斌斌）</h1>
      <p class="path" id="cfgPath" data-i18n="settings.cfgLoading">配置文件加载中…</p>
    </header>

    <section class="opts">
      <h2 data-i18n="settings.optsHeader">常规</h2>
      <label class="row">
        <input type="checkbox" id="fullscreen" />
        <span data-i18n="settings.fullscreenLabel">启动时全屏</span>
      </label>
      <label class="row">
        <span data-i18n="settings.layoutLabel">布局模式</span>
        <select id="layout">
          <option value="auto" data-i18n="settings.layoutAuto">智能网格（自动平铺）</option>
          <option value="manual" data-i18n="settings.layoutManual">手动栅格（按下方比例）</option>
        </select>
      </label>
      <label class="row">
        <span data-i18n="settings.refreshLabel">自动刷新（秒，0 关闭）</span>
        <input type="number" id="refresh" min="0" step="5" />
      </label>
      <label class="row">
        <span data-i18n="settings.languageLabel">界面语言</span>
        <select id="language">
          <option value="auto" data-i18n="settings.langAuto">跟随系统</option>
          <option value="zh" data-i18n="settings.langZh">中文</option>
          <option value="en" data-i18n="settings.langEn">English</option>
        </select>
      </label>
    </section>

    <section>
      <div class="section-head">
        <h2 data-i18n="settings.urlsHeader">网址列表</h2>
        <div>
          <button id="addBtn" class="primary" data-i18n="settings.add">+ 新增</button>
          <button id="previewBtn" data-i18n="settings.preview">预览布局</button>
        </div>
      </div>
      <ul id="urlList" class="url-list"></ul>
    </section>

    <section>
      <h2 data-i18n="settings.previewHeader">布局预览</h2>
      <div class="preview-wrap">
        <div id="preview" class="preview"></div>
      </div>
      <p class="muted" data-i18n="settings.previewHint">
        手动模式下可拖动右下角调整每块大小，拖动块体调整位置。比例自动写回 YAML。
      </p>
    </section>

    <footer>
      <button id="reloadBtn" data-i18n="settings.btnReload">放弃并重读 YAML</button>
      <button id="saveBtn" class="primary" data-i18n="settings.btnSave">保存并应用</button>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
